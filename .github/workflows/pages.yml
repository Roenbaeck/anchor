# Publishes the modeler to GitHub Pages (https://roenbaeck.github.io/anchor/) on every push to master.
# The site is static and runs entirely in the browser, so the repository is published as it is, without a build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # allows a deployment to be started by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time, and a newer push does not cancel one that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
